<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Kidi Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/catalog.css" />
</head>
<body class="catalog-page">
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" id="logo"><img class="custom-logo" src="img/logo.jpg" alt="Kidi Care Logo" width="48" height="48" /><span class="logo-text">Kidi Care</span></a>
      <nav class="nav-links" id="nav-links"><a href="index.html">Home</a><a href="shop.html" class="active">Shop</a><a href="categories.html">Categories</a><a href="index.html#trust">About Us</a><a href="index.html#footer">Contact</a></nav>
      <div class="search-bar" id="search-bar"><select id="search-category" aria-label="Category filter"><option value="all">All</option><option value="pediatric">Pediatric</option><option value="firstaid">First Aid</option><option value="hygiene">Hygiene</option></select><input type="text" placeholder="Search products..." id="search-input" aria-label="Search products" /><button type="button" id="search-btn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button></div>
      <div class="header-actions"><a class="icon-btn" href="cart.html" aria-label="Shopping cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></a><a class="account-btn" href="auth.html" aria-label="Log in or sign up"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Account</span></a><button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button></div>
    </div>
  </header>
  <main class="catalog-main">
    <div class="catalog-heading"><span class="catalog-kicker">Care essentials for every family</span><h1>Shop all products</h1><p>Certified pediatric healthcare products, selected with care.</p><button class="owner-add-product" id="owner-add-product" type="button">＋ Add product</button></div>
    <form class="shop-add-form" id="shop-add-form" hidden><h2>Add a new product</h2><div class="shop-add-grid"><label>Name<input name="name" required /></label><label>Price<input name="price" type="number" min="0" step="0.01" required /></label><label>Image filename<input name="image" placeholder="product-thermometer.jpg" required /></label><label>Rating<input name="rating" placeholder="New" required /></label><label class="full-field">Description<textarea name="description" required></textarea></label></div><button type="submit">Add product</button><p id="shop-add-status" role="status"></p></form>
    <div class="catalog-grid" id="shop-grid"></div>
  </main>
  <script src="js/shop.js"></script>
</body>
</html>
