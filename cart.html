<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Kidi Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/cart.css" />
</head>
<body class="cart-page">
  <header class="cart-header">
    <a class="logo" href="index.html"><img class="custom-logo" src="img/logo.jpg" alt="Kidi Care Logo" width="48" height="48" /><span class="logo-text">Kidi Care</span></a>
    <a class="cart-back" href="index.html">← Continue shopping</a>
  </header>
  <main class="cart-main">
    <div class="cart-heading"><span class="cart-kicker">Your essentials</span><h1>Your shopping cart</h1><p id="cart-count-label"></p></div>
    <div class="cart-layout">
      <section class="cart-items" id="cart-items" aria-live="polite"></section>
      <aside class="cart-summary">
        <h2>Order summary</h2>
        <div class="summary-line"><span>Subtotal</span><strong id="cart-subtotal">$0.00</strong></div>
        <div class="summary-line"><span>Delivery</span><span>Free</span></div>
        <div class="summary-total"><span>Total</span><strong id="cart-total">$0.00</strong></div>
        <button class="checkout-btn" id="checkout-btn" type="button">Proceed to checkout</button>
        <p class="cart-payment-note">Secure payments with Visa, Mastercard, AMEX, PayPal, Apple Pay, or cash on delivery.</p>
      </aside>
    </div>
  </main>
  <script src="js/cart.js"></script>
</body>
</html>
